[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magna-slm"
version = "0.1.0"
description = "Offline Indic voice assistant around Colibri"
requires-python = ">=3.11"
dependencies = [
	"tokenizers>=0.23",
	"langchain>=1.4",
	"langchain-openai>=1.7",
	"langgraph>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]